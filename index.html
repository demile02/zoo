     pengunjung tidak perlu memutar HP. Di layar landscape tidak ada putaran. */
  @media (orientation:portrait){
    #app{inset:auto;top:0;left:0;width:100vh;width:100dvh;height:100vw;height:100dvw;transform:rotate(90deg) translateY(-100%);transform-origin:top left}
  }
  #scene{position:fixed;inset:0;display:block;touch-action:none}
  .hud{position:fixed;z-index:10;pointer-events:none}
  #brand{top:12px;left:12px;background:rgba(253,252,248,.94);border-radius:999px;padding:7px 14px;box-shadow:var(--card-shadow);display:flex;align-items:baseline;gap:9px;max-width:94vw}
  #brand .wordmark{font-family:'Reenie Beanie',cursive;font-size:21px;line-height:1;color:var(--leaf);white-space:nowrap}
  #brand .sub{font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
  #hint{top:14px;right:14px;background:rgba(253,252,248,.92);border-radius:14px;padding:8px 12px;font-size:12px;font-weight:600;box-shadow:var(--card-shadow);text-align:right;line-height:1.5}
  #hint kbd{background:var(--ink);color:var(--paper);border-radius:5px;padding:0 5px;font-family:inherit;font-size:11px}
  #card{left:12px;top:58px;transform:translateX(-115%);transition:transform .35s cubic-bezier(.2,.9,.25,1);width:min(80vw,340px);background:var(--paper);border-radius:24px;box-shadow:var(--card-shadow);padding:16px 18px}
  #card.show{transform:translateX(0)}
  #card .species{font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--accent);text-transform:uppercase}
  #card h2{font-size:24px;font-weight:800;line-height:1.1;margin:2px 0 4px}
  #card p{font-size:14px;line-height:1.45}

  #bubble{position:absolute;z-index:7;max-width:230px;background:var(--paper);border-radius:16px;box-shadow:var(--card-shadow);padding:9px 13px 10px;transform:translate(-50%,-118%) scale(.85);opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none}
  #bubble.show{opacity:1;transform:translate(-50%,-118%) scale(1)}
  #bubble::after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--paper);border-bottom:0}
  #bubbleName{font-size:11px;font-weight:800;letter-spacing:.08em;color:#6F66A3;text-transform:uppercase}
  #bubbleText{font-size:13.5px;font-weight:600;line-height:1.35;margin-top:1px}
  #talkBtn{position:absolute;z-index:8;right:16px;bottom:92px;background:#6F66A3;color:#fff;border:0;font:inherit;font-weight:800;font-size:15px;padding:13px 20px;border-radius:999px;box-shadow:0 12px 26px rgba(46,42,36,.3);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .2s ease,transform .2s ease;cursor:pointer}
  #talkBtn.show{opacity:1;transform:none;pointer-events:auto}
  #talkBtn:active{transform:scale(.96)}
  #jumpBtn{position:absolute;z-index:8;right:16px;bottom:16px;width:62px;height:62px;border-radius:50%;background:var(--paper);color:var(--ink);border:2px solid #E6E6FA;font:inherit;font-weight:800;font-size:12.5px;box-shadow:0 12px 26px rgba(46,42,36,.25);cursor:pointer}

{

/* Penanda zoo = papan kayu fisik yang berdiri di dunia, bukan teks melayang:
   dua tiang + papan coklat berteks cat, satu keluarga dengan papan gerbang utama.
   Ukurannya tetap di dunia, jadi layar tidak penuh teks dari segala jarak. */
function signBoard(top, bottom, w = 3.4, h = 1.05, cy = 1.6){
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = Math.max(96, Math.round(512 * h / w));
  const c = cv.getContext('2d');
  c.fillStyle = '#6f5133'; c.fillRect(0, 0, cv.width, cv.height);
  c.strokeStyle = 'rgba(253,252,248,.45)'; c.lineWidth = 5;
  c.strokeRect(12, 12, cv.width - 24, cv.height - 24);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const fit = (txt, size)=>{
    do { c.font = `800 ${size}px Outfit, sans-serif`; size -= 2; }
    while(c.measureText(txt).width > cv.width - 56 && size > 18);
  };
  fit(top, 34);
  c.fillStyle = '#efd9ae'; c.fillText(top, cv.width/2, cv.height * .30);
  fit(bottom, 56);
  c.fillStyle = '#fdfcf8'; c.fillText(bottom, cv.width/2, cv.height * .66);
  return { w, h, cy, tex: new THREE.CanvasTexture(cv) };
}
/* Papan selalu di tepi, tidak di tengah jalan: ditaruh lewat fungsi ini
   supaya posisinya di sudut area dan pengunjung tidak menabraknya. */
function placeSign(s, x, z, ry = 0){
  const postH = s.cy + s.h/2;
  for(const px of [-s.w/2 + .35, s.w/2 - .35]){
    const g = new THREE.BoxGeometry(.16, postH, .16);
    g.translate(px, postH/2, 0); g.rotateY(ry); g.translate(x, 0, z);
    WOOD_GEOS.push(g);
  }
  const bg = new THREE.BoxGeometry(s.w, s.h, .18);
  bg.translate(0, s.cy, 0); bg.rotateY(ry); bg.translate(x, 0, z);
  WOOD_GEOS.push(bg);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(s.w - .12, s.h - .12),
    new THREE.MeshBasicMaterial({ map: s.tex }));
  face.position.set(x + Math.sin(ry) * .1, s.cy, z + Math.cos(ry) * .1);
  face.rotation.y = ry;
  scene.add(face);
  const bw = s.w * Math.abs(Math.cos(ry)) + .18 * Math.abs(Math.sin(ry));
  const bd = s.w * Math.abs(Math.sin(ry)) + .18 * Math.abs(Math.cos(ry));
  collideBox(x, z, bw, bd);
}

/* Pagar petak: tiang + dua palang di empat sisi */
function fencePlot(p){
  flatRect(p.cx, p.cz, p.w, p.d, p.ground, .018);
  const x0=p.cx-p.w/2, x1=p.cx+p.w/2, z0=p.cz-p.d/2, z1=p.cz+p.d/2;
  const post = (x,z)=> POST_B.push([x,z]);
  const rail = (len,x,z,rot)=>{
    for(const y of [.95, .45]){
      const g = new THREE.BoxGeometry(len,.12,.08);
      if(rot) g.rotateY(rot);
      g.translate(x, y, z);
      RAIL_GEOS.push(g);
    }
  };
  const step = Math.max(2, Math.floor(Math.min(p.w,p.d)/4));
  for(let x=x0; x<=x1+.01; x+=step){ post(x,z0); post(x,z1); }
  for(let z=z0+step; z<z1; z+=step){ post(x0,z); post(x1,z); }
  rail(p.w,p.cx,z0,0); rail(p.w,p.cx,z1,0);
  rail(p.d,x0,p.cz,Math.PI/2); rail(p.d,x1,p.cz,Math.PI/2);
  /* Tabrakan pagar = empat garis tipis mengikuti pagar, bertanda low:
     bisa dilompati (lompatan cukup tinggi pagar tidak menahan), tapi
     tidak bisa ditembus sambil jalan biasa. */
  collideBox(p.cx, z0, p.w + .9, .9, 1.15);
  collideBox(p.cx, z1, p.w + .9, .9, 1.15);
  collideBox(x0, p.cz, .9, p.d + .9, 1.15);
  collideBox(x1, p.cz, .9, p.d + .9, 1.15);
  const label = p.animal ? p.animal.name : 'Kosong';
  placeSign(signBoard(p.code, label), p.cx, z1 + 1.5, 0);
}
PLOTS.forEach(fencePlot);

/* Gambar semua tiang pagar yang terkumpul sebagai dua InstancedMesh */
function buildPosts(list, r, h){
  if(!list.length) return;
  const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(r, r, h, 8), MAT.woodD, list.length);
  const m4 = new THREE.Matrix4();
  list.forEach(([x,z], i)=>{ m4.makeTranslation(x, h/2, z); im.setMatrixAt(i, m4); });
  im.receiveShadow = true;
  scene.add(im);
}

/* Manusia low-poly berkaki dan bertangan: kaki berporos di pinggul,
   badan+tangan+kepala satu kelompok berporos di pinggang supaya bisa
   condong saat lari atau miring saat menyamping. */
function makeHumanoid(o){
  const g = new THREE.Group();
  const shirt = new THREE.MeshLambertMaterial({ color:o.shirt });
  const skin = new THREE.MeshLambertMaterial({ color:o.skin });
  const pants = new THREE.MeshLambertMaterial({ color:o.pants });
  const shoe = new THREE.MeshLambertMaterial({ color:0x333a45 });
  const hatM = new THREE.MeshLambertMaterial({ color:o.hat });
  const P = { group: g };
  const limb = (parent, x, y, z)=>{
    const p = new THREE.Group(); p.position.set(x, y, z); parent.add(p); return p;
  };
  P.legL = limb(g, -.21, .98, 0); P.legR = limb(g, .21, .98, 0);
  for(const leg of [P.legL, P.legR]){
    box(.3, .92, .34, pants, 0, -.46, 0, leg);
    box(.3, .13, .52, shoe, 0, -.9, .07, leg);
  }
  P.body = limb(g, 0, .95, 0);
  cyl(.42,.5,1.05,shirt,0,.5,0,P.body,12);
  P.armL = limb(P.body, -.58, .95, 0); P.armR = limb(P.body, .58, .95, 0);
  P.armL.rotation.z = .07; P.armR.rotation.z = -.07;
  for(const arm of [P.armL, P.armR]){
    cyl(.13,.12,.8,shirt,0,-.36,0,arm,8);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(.13,8,8), skin);
    hand.position.y = -.8; arm.add(hand);
  }
  const head = new THREE.Mesh(new THREE.SphereGeometry(.42,12,10), skin);
  head.position.y = 1.43; P.body.add(head);
  if(o.hatStyle === 'brim'){
    cyl(.46,.48,.16,hatM,0,1.74,0,P.body,12);
    cyl(.74,.74,.05,hatM,0,1.66,0,P.body,16);
  } else {
    cyl(.45,.46,.18,hatM,0,1.73,0,P.body,12);
    box(.52,.06,.4,hatM,0,1.65,.38,P.body);
  }
  g.traverse(m=>{ if(m.isMesh) m.castShadow = true; });
  return P;
}

/* Kontrol ala FPS: analog melayang di sisi kiri buat jalan (relatif arah pandang),
   seret layar di mana pun buat menentukan arah. Dua sentuhan bisa jalan bersamaan. */
const joyVec = { x:0, y:0 };
let heading = RESTORE.h;
{
  const ui = document.getElementById('touchUI');
  const joy = document.getElementById('joy'), knob = document.getElementById('joyKnob');
  const TRAVEL = 46, DEAD = 0.14, SENS = 0.0042;
  let stickId = null, lookId = null, ox = 0, oy = 0, lx = 0;
  const setKnob = (dx,dy)=>{ knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; };
  /* Di mode potret app diputar CSS 90 derajat, jadi koordinat sentuh layar
     diterjemahkan dulu ke koordinat app sebelum dipakai. */
  const portraitMq = matchMedia('(orientation: portrait)');
  const toLocal = e => portraitMq.matches
    ? { x: e.clientY, y: innerWidth - e.clientX }
    : { x: e.clientX, y: e.clientY };
  /* Sekali sentuh pertama: coba kunci landscape asli peramban (layar penuh).
     Kalau peramban menolak (mis. iOS), putaran CSS di atas tetap menjamin landscape. */
  let lockTried = false;
  function tryLandscapeLock(){
    if(lockTried) return; lockTried = true;
    const lock = ()=>{ try {
      const p = screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape');
      if(p && p.catch) p.catch(()=>{});
    } catch(_){} };
    try {
      const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      if(r && r.then) r.then(lock, ()=>{});
      else lock();
    } catch(_){}
  }
  ui.addEventListener('contextmenu', e=> e.preventDefault());
  ui.addEventListener('pointerdown', e=>{
    tryLandscapeLock();
    ui.setPointerCapture(e.pointerId);
    const p = toLocal(e);
    if(e.pointerType !== 'mouse' && stickId === null && p.x < viewW() * .45 && p.y > 70){
      stickId = e.pointerId;
      ox = Math.min(Math.max(p.x, 66), viewW() - 66);
      oy = Math.min(Math.max(p.y, 66), viewH() - 66);
      joy.style.left = ox + 'px'; joy.style.top = oy + 'px';
      knob.classList.remove('rel'); setKnob(0,0);
      joyVec.x = joyVec.y = 0;
      joy.classList.add('on');
    } else if(lookId === null){
      lookId = e.pointerId; lx = p.x;
    }
  });
  ui.addEventListener('pointermove', e=>{
    const p = toLocal(e);
    if(e.pointerId === stickId){
      let dx = p.x - ox, dy = p.y - oy;
      const len = Math.hypot(dx,dy);
      if(len > TRAVEL){ dx *= TRAVEL/len; dy *= TRAVEL/len; }
      setKnob(dx,dy);
      const cl = Math.min(len, TRAVEL);
      const mag = cl / TRAVEL;
      if(mag < DEAD){ joyVec.x = joyVec.y = 0; }
      else {
        const s = (mag - DEAD) / (1 - DEAD);
        const inv = cl > 0 ? s / cl : 0;
        joyVec.x = dx * inv; joyVec.y = dy * inv;
      }
    } else if(e.pointerId === lookId){
      heading -= (p.x - lx) * SENS;
      lx = p.x;
    }
  });
  const end = e=>{
    if(e.pointerId === stickId){
      stickId = null; joyVec.x = joyVec.y = 0;
      knob.classList.add('rel'); setKnob(0,0);
      joy.classList.remove('on');
    }
    if(e.pointerId === lookId) lookId = null;
  };
  ui.addEventListener('pointerup', end);
  ui.addEventListener('pointercancel', end);
}

    text:'Sumber air zona barat, sekarang jauh lebih besar. Tepi danau ini nanti jadi tempat melihat penghuni D1, D2, dan D3.',
    from:'Bagian dari denah induk v1.1' } },
  { id:'PANGGUNG', x:-16, z:21, radius:12, fixed:{ species:'Area Edukasi', name:'Panggung Edukasi',
    text:'Di sini direktur mengumumkan hewan baru dan keeper bercerita soal penghuni zoo.',
    from:'Bagian dari denah induk v1.1' } },
);
const card = document.getElementById('card');
const cardEls = {
  species: document.getElementById('cardSpecies'),
  name: document.getElementById('cardName'),
  text: document.getElementById('cardText'),
  from: document.getElementById('cardFrom'),
};
let cardFor = '__none__';
function updateCard(){
  let near = null, best = 1e9;
  for(const s of SPOTS){
    const d = Math.hypot(visitor.position.x - s.x, visitor.position.z - s.z);
    if(d < best){ best = d; near = s; }
  }
  const id = (near && best <= near.radius) ? near.id : null;
  if(id === cardFor) return;
  cardFor = id;
  if(!id){ card.classList.remove('show'); return; }
  if(near.fixed){
    cardEls.species.textContent = near.fixed.species;
    cardEls.name.textContent = near.fixed.name;
    cardEls.text.textContent = near.fixed.text;
    cardEls.from.textContent = near.fixed.from;
  } else if(near.plot.animal){
    const a = near.plot.animal;
    cardEls.species.textContent = near.plot.code + ' · ' + a.species;
    cardEls.name.textContent = a.name;
    cardEls.text.textContent = a.text;
    cardEls.from.textContent = a.from;
  } else {
    cardEls.species.textContent = near.plot.code + ' · ' + near.plot.block;
    cardEls.name.textContent = 'Masih kosong';
    cardEls.text.textContent = 'Petak untuk ' + near.plot.use + '. Penghuninya dipilih dari komentar paling disukai di video terbaru.';
    cardEls.from.textContent = 'Menunggu komentar teratas';
  }
  card.classList.add('show');
}

/* Interaksi karakter: dekati karakter sampai tombol Sapa muncul, tekan
   tombolnya (atau tombol E) dan karakter menjawab lewat bubble + suara
   sambil melompat (hewan) atau melambai (Pak Direktur). */
const talkBtn = document.getElementById('talkBtn');
const bubble = document.getElementById('bubble');
const bubbleName = document.getElementById('bubbleName');
const bubbleText = document.getElementById('bubbleText');
let nearChar = null, bubbleFor = null, bubbleUntil = 0;
/* Suara karakter BUKAN TTS: tiap karakter punya efek suara sendiri.
   Pasang berkas suara (misalnya suara request penonton) dengan menaruh
   berkasnya di folder sounds/ lalu mengisi file: 'sounds/namafile.mp3'
   pada SUARA di bawah. Selama file kosong, suaranya dibuat sintetis
   mengikuti jenisnya. */
const SUARA = {
  'Galang': { file: null, jenis: 'kera' },
  'Pak Direktur': { file: null, jenis: 'sapaan' },
};
let AC = null;
function audioCtx(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function sfxKera(){
  const ac = audioCtx(), t0 = ac.currentTime;
  const n = 4 + Math.floor(Math.random() * 2);
  for(let i = 0; i < n; i++){
    const t = t0 + i * .14;
    const o = ac.createOscillator(), g = ac.createGain(), flt = ac.createBiquadFilter();
    o.type = 'sawtooth';
    const f = 700 + Math.random() * 500;
    o.frequency.setValueAtTime(f * 1.3, t);
    o.frequency.exponentialRampToValueAtTime(f * .6, t + .11);
    flt.type = 'bandpass'; flt.frequency.value = 1200; flt.Q.value = 1.2;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.16, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + .12);
    o.connect(flt); flt.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + .13);
  }
}
function sfxSapaan(){
  const ac = audioCtx(), t0 = ac.currentTime;
  [[660, 0], [880, .13]].forEach(([f, dt])=>{
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    const t = t0 + dt;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.18, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + .3);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + .32);
  });
}
const fileAudio = {};
function playSound(c){
  const s = SUARA[c.name];
  if(s && s.file){
    try{
      if(!fileAudio[c.name]) fileAudio[c.name] = new Audio(s.file);
      const a = fileAudio[c.name]; a.currentTime = 0; a.play();
    }catch(_){}
    return;
  }
  if(s && s.jenis === 'sapaan') sfxSapaan(); else sfxKera();
}
function interact(){
  if(!nearChar) return;
  const c = nearChar;
  const line = c.lines[c.idx % c.lines.length]; c.idx++;
  bubbleName.textContent = c.name;
  bubbleText.textContent = line;
  bubbleFor = c; bubbleUntil = performance.now() + 4200;
  bubble.classList.add('show');
  c.speakT = clock.elapsedTime;
  playSound(c);
}
talkBtn.addEventListener('click', interact);
addEventListener('keydown', e=>{ if(e.key.toLowerCase() === 'e') interact(); });
document.getElementById('jumpBtn').addEventListener('pointerdown', e=>{ e.preventDefault(); doJump(); });
addEventListener('keydown', e=>{ if(e.code === 'Space'){ e.preventDefault(); doJump(); } });
const projV = new THREE.Vector3();
function updateInteract(t){
  let best = 1e9; nearChar = null;
  for(const c of INTERACT){
    const d = Math.hypot(visitor.position.x - c.x, visitor.position.z - c.z);
    if(d < best){ best = d; nearChar = c; }
  }
  if(!nearChar || best > 10) nearChar = null;
  if(nearChar){
    talkBtn.textContent = '💬 Sapa ' + nearChar.name;
    talkBtn.classList.add('show');
  } else talkBtn.classList.remove('show');
  for(const c of INTERACT){
    const p = (t - c.speakT) / .7;
    if(c.parts){
      c.parts.armR.rotation.z = (p >= 0 && p < 1.8) ? 2.3 + Math.sin(t * 11) * .35 : -.07;
    } else if(c.group){
      c.group.position.y = (p >= 0 && p < 1) ? c.baseY + Math.sin(p * Math.PI) * .8 : c.baseY;
    }
  }
  if(bubbleFor && performance.now() < bubbleUntil){
    projV.set(bubbleFor.x, bubbleFor.top, bubbleFor.z).project(camera);
    if(projV.z < 1){
      bubble.style.left = (projV.x * .5 + .5) * viewW() + 'px';
      bubble.style.top = (-projV.y * .5 + .5) * viewH() + 'px';
      bubble.style.visibility = 'visible';
    } else bubble.style.visibility = 'hidden';
  } else { bubbleFor = null; bubble.classList.remove('show'); }
}

/* Gabung semua geometri statis per material menjadi satu mesh per kelompok */
function mergeInto(list, mat){
  if(!list.length) return;
  const m = new THREE.Mesh(mergeGeometries(list), mat);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
}
mergeInto(WOOD_GEOS, MAT.woodD);
mergeInto(RAIL_GEOS, MAT.wood);
mergeInto(WALL_GEOS, MAT.wall);
mergeInto(ROOF_GEOS, MAT.roof);
mergeInto(TRUNK_GEOS, MAT.trunk);
mergeInto(LEAF_GEOS, MAT.leaf);
mergeInto(LEAF2_GEOS, MAT.leaf2);

const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 16, 103);
/* Skala kualitas adaptif: kalau frame rate jatuh, resolusi render diturunkan
   bertahap (dan bayangan dimatikan di tingkat terendah) supaya tetap mulus
   di HP lemah; naik lagi sendiri kalau mesinnya ternyata kuat. */
let perfFrames = 0, perfTime = 0, prLevel = 0;
const PR_STEPS = [Math.min(devicePixelRatio || 1, 1.5), 1.25, 1.1, 1];
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  perfFrames++; perfTime += dt;
  if(perfFrames >= 100){
    const fps = perfFrames / perfTime;
    perfFrames = 0; perfTime = 0;
    if(fps < 45 && prLevel < PR_STEPS.length - 1){
      prLevel++; renderer.setPixelRatio(PR_STEPS[prLevel]); applySize();
      if(prLevel === PR_STEPS.length - 1) sun.castShadow = false;
    } else if(fps > 57 && prLevel > 0){
      prLevel--; renderer.setPixelRatio(PR_STEPS[prLevel]); applySize();
      sun.castShadow = true;
    }
  }

  /* Masukan dalam ruang kamera: iz maju+, ix kanan+ */
  let ix = 0, iz = 0;
  if(keys['w'] || keys['arrowup']) iz += 1;
  if(keys['s'] || keys['arrowdown']) iz -= 1;
  if(keys['a'] || keys['arrowleft']) ix -= 1;
  if(keys['d'] || keys['arrowright']) ix += 1;
  ix += joyVec.x; iz -= joyVec.y;
  const len = Math.hypot(ix,iz);
  const gait = Math.min(1, len);
  const moving = len > .02;
  let fwd = 0, side = 0;
  if(moving){
    const fx = Math.sin(heading), fz = Math.cos(heading);
    const mx = (fx * iz - fz * ix) / (len || 1), mz = (fz * iz + fx * ix) / (len || 1);
    fwd = mx * fx + mz * fz;
    side = mx * fz - mz * fx;
    const speed = 17 * gait;
    let nx = visitor.position.x + mx * speed * dt;
    let nz = visitor.position.z + mz * speed * dt;
    nx = THREE.MathUtils.clamp(nx, -126, 126);
    nz = THREE.MathUtils.clamp(nz, -92, 92);
    for(const c of colliders){
      if(c.box){
        if(c.low && jumpY > c.low){
          /* Sedang melompat di atas pagar rendah: tidak ditahan */
        } else if(nx > c.x0 && nx < c.x1 && nz > c.z0 && nz < c.z1){
          const dxl = Math.abs(nx - c.x0), dxr = Math.abs(nx - c.x1);
          const dzl = Math.abs(nz - c.z0), dzr = Math.abs(nz - c.z1);
          const m = Math.min(dxl, dxr, dzl, dzr);
          if(m === dxl) nx = c.x0; else if(m === dxr) nx = c.x1;
          else if(m === dzl) nz = c.z0; else nz = c.z1;
        }
      } else {
        const dd = Math.hypot(nx - c.x, nz - c.z);
        if(dd < c.r && dd > 0){ nx = c.x + (nx - c.x)/dd * c.r; nz = c.z + (nz - c.z)/dd * c.r; }
      }
    }
    visitor.position.x = nx; visitor.position.z = nz;
  }
  visitor.rotation.y = heading;
  /* Gaya jalan dibedakan dari besar dan arah geraknya:
     santai = langkah kecil pelan, lari = langkah lebar cepat + badan condong,
     menyamping = kaki menggunting ke samping + badan miring. */
  if(moving) walkPhase += dt * (6.5 + 7.5 * gait);
  swingAmp += ((moving ? 1 : 0) - swingAmp) * Math.min(1, dt * 10);
  const amp = (.3 + .5 * gait) * swingAmp;
  const ph = Math.sin(walkPhase);
  const fW = Math.min(1, Math.abs(fwd) * 1.6), sW = Math.min(1, Math.abs(side) * 1.6);
  const fSign = fwd < 0 ? -1 : 1;
  legL.rotation.x = ph * amp * fW * fSign;
  legR.rotation.x = -ph * amp * fW * fSign;
  legL.rotation.z = ph * amp * .7 * sW;
  legR.rotation.z = -ph * amp * .7 * sW;
  armL.rotation.x = -legL.rotation.x * .85;
  armR.rotation.x = -legR.rotation.x * .85;
  bodyG.rotation.x = (.04 + .2 * gait * fW) * swingAmp;
  bodyG.rotation.z = -side * .14 * swingAmp;
  if(jumpV !== 0 || jumpY > 0){
    jumpV -= 26 * dt; jumpY += jumpV * dt;
    if(jumpY <= 0){ jumpY = 0; jumpV = 0; }
  }
  visitor.position.y = Math.abs(Math.cos(walkPhase)) * (.03 + .05 * gait) * swingAmp + jumpY;

  const fx = Math.sin(heading), fz = Math.cos(heading);
  const want = new THREE.Vector3(visitor.position.x - fx * 13, 9.5, visitor.position.z - fz * 13);
  camPos.lerp(want, 1 - Math.pow(.0001, dt));
  camera.position.copy(camPos);
  camera.lookAt(visitor.position.x + fx * 6, 2.2, visitor.position.z + fz * 6);

  updateCard();
  updateInteract(t);
  for(const c of CLOUDS){ c.position.x += dt * .7; if(c.position.x > 290) c.position.x = -290; }
  renderer.render(scene, camera);
}
tick();

function applySize(){
  camera.aspect = viewW()/viewH();
  camera.updateProjectionMatrix();
  renderer.setSize(viewW(), viewH());
}
addEventListener('resize', applySize);
addEventListener('orientationchange', ()=> setTimeout(applySize, 60));

/* Cek versi berkala: ada BUILD baru -> simpan posisi, muat ulang sendiri */
setInterval(async ()=>{
  try{
    const r = await fetch(location.href, { cache:'no-store' });
    const txt = await r.text();
    const m = txt.match(/const BUILD = '([^']+)'/);
    if(m && m[1] !== BUILD){
      try{ sessionStorage.setItem('zoo-pos', JSON.stringify({ x:visitor.position.x, z:visitor.position.z, h:heading })); }catch(_){}
      location.reload();
    }
  }catch(_){}
}, 40000);
</script>
